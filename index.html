<title>Dabelz Studio — Invoice & Quotation</title>
<style>
:root{
  --font:'Plus Jakarta Sans',system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --acc:#8B5CF6;--acc2:#22D3EE;--acc-rgb:139,92,246;
  --r-sm:10px;--r-md:16px;
}
html[data-accent=teal]{--acc:#14B8A6;--acc2:#38BDF8;--acc-rgb:20,184,166}
html[data-accent=blue]{--acc:#3B82F6;--acc2:#A855F7;--acc-rgb:59,130,246}
html[data-accent=pink]{--acc:#EC4899;--acc2:#F59E0B;--acc-rgb:236,72,153}
html[data-mode=dark]{color-scheme:dark;
  --bg:#08090D;--surface:#111319;--surface2:#181B23;--surface3:#20242E;--border:rgba(255,255,255,.07);--border2:rgba(255,255,255,.13);
  --text:#EDEFF4;--text2:#A2A8B6;--text3:#666D7C;
  --acc-soft:rgba(var(--acc-rgb),.16);--acc-text:color-mix(in srgb,var(--acc) 62%,#fff);
  --ok:#34D399;--ok-bg:rgba(52,211,153,.13);--bad:#FB7185;--bad-bg:rgba(251,113,133,.13);--warn:#FBBF24;--warn-bg:rgba(251,191,36,.13);
  --shadow:0 18px 50px rgba(0,0,0,.45);--glow:.22}
html[data-mode=light]{color-scheme:light;
  --bg:#F3F4F9;--surface:#FFFFFF;--surface2:#F3F4F8;--surface3:#E9EBF1;--border:rgba(16,19,32,.08);--border2:rgba(16,19,32,.15);
  --text:#11131A;--text2:#596070;--text3:#9399A6;
  --acc-soft:rgba(var(--acc-rgb),.11);--acc-text:color-mix(in srgb,var(--acc) 82%,#000);
  --ok:#059669;--ok-bg:#E3F7EF;--bad:#E11D48;--bad-bg:#FDEBEF;--warn:#B45309;--warn-bg:#FEF3DF;
  --shadow:0 12px 34px rgba(20,24,40,.10);--glow:.10}
html{
  /* nama lama yang masih digunakan dalam markup */
  --p50:var(--acc-soft);--p100:rgba(var(--acc-rgb),.38);--p500:var(--acc);--pbar:var(--acc);--phover:var(--acc);--ring:rgba(var(--acc-rgb),.28);
  --ok50:var(--ok-bg);--bad50:var(--bad-bg);--warn200:var(--warn-bg);--warnfg:var(--warn);
  --g50:var(--surface2);--g100:var(--border);--g300:var(--text3);--g400:var(--text3);--g600:var(--text2);--g700:var(--text2);--g900:var(--text);
  --ink:var(--text);--mut:var(--text2);--line:var(--border);--red:var(--bad);--amb:var(--warn);--grn:var(--ok);
  --grad:linear-gradient(135deg,var(--acc),color-mix(in srgb,var(--acc) 45%,var(--acc2)))}
*{box-sizing:border-box}
html,body{margin:0}
body{font:400 14px/1.5 var(--font);color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased;min-height:100vh;
  background-image:radial-gradient(900px 520px at 12% -12%,rgba(var(--acc-rgb),var(--glow)),transparent 62%),radial-gradient(700px 420px at 105% -5%,color-mix(in srgb,var(--acc2) 22%,transparent),transparent 60%);background-attachment:fixed;transition:background-color .25s,color .25s}
::selection{background:rgba(var(--acc-rgb),.35)}
a{color:var(--acc-text);text-decoration:none}
svg.i{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
button svg.i,.btn svg.i{width:16px;height:16px}
.app{display:flex;min-height:100vh}
/* sidebar */
nav.side{width:252px;flex-shrink:0;background:color-mix(in srgb,var(--surface) 70%,transparent);backdrop-filter:blur(18px);border-right:1px solid var(--border);padding:22px 0 16px;position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column;gap:22px;z-index:40}
.brand{display:flex;gap:12px;align-items:center;padding:0 20px;color:inherit}
.brand .lg{width:42px;height:42px;border-radius:13px;background:var(--grad);display:grid;place-items:center;flex:none;box-shadow:0 8px 22px rgba(var(--acc-rgb),.4)}
.brand .lg img{width:30px;height:30px}
.brand b{display:block;font:800 15px/18px var(--font);letter-spacing:.02em;color:var(--text)}
.brand small{display:block;color:var(--text3);font-size:12px;line-height:14px;margin-top:3px}
.sec{display:flex;flex-direction:column;gap:2px}
.sec h3{margin:0 0 6px;padding:0 24px;font:700 10.5px/1 var(--font);letter-spacing:.12em;color:var(--text3);text-transform:uppercase}
a.ni{display:flex;align-items:center;gap:12px;margin:0 12px;padding:10px 12px;border-radius:12px;font:500 14px/20px var(--font);color:var(--text2);transition:background .15s,color .15s}
a.ni:hover{background:var(--surface2);color:var(--text)}
a.ni.on{background:var(--acc-soft);color:var(--text);font-weight:600}
a.ni.on svg{color:var(--acc-text)}
a.ni .cnt{margin-left:auto;font:700 11px/1 var(--font);background:var(--bad);color:#fff;padding:4px 7px;border-radius:99px}
a.ni .cnt:empty{display:none}
.fsb{margin:auto 12px 0;font:500 12px/16px var(--font);padding:12px 14px;border-radius:14px;background:var(--surface2);border:1px solid var(--border);color:var(--text2);cursor:pointer;display:flex;gap:10px;align-items:center}
.fsb.ok::before,.fsb.saving::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none;box-shadow:0 0 0 4px var(--ok-bg)}
.fsb.saving::before{background:var(--warn);box-shadow:0 0 0 4px var(--warn-bg)}
.fsb.need,.fsb.error{background:var(--bad-bg);color:var(--bad);border-color:transparent}
.fsb:empty{display:none}
/* topnav + content */
.wrap{flex:1;min-width:0;display:flex;flex-direction:column}
.topnav{height:70px;background:color-mix(in srgb,var(--bg) 72%,transparent);backdrop-filter:blur(16px) saturate(1.4);padding:14px 36px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:30}
.topnav .sp{flex:1}
.search{position:relative;width:380px}
.search svg{position:absolute;left:14px;top:11px;color:var(--text3);width:18px;height:18px}
.search input{padding-left:42px;border-radius:12px}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--grad);display:grid;place-items:center;font:700 13px/1 var(--font);color:#fff;flex:none;cursor:pointer}
#menuBtn{display:none}
main{flex:1;padding:28px 36px 8px;width:100%;max-width:1640px}
.crumbs{font:500 13px/18px var(--font);color:var(--text3);margin-bottom:6px}
.crumbs a{color:var(--text3)}.crumbs a:hover{color:var(--text)}
.crumbs .cur{color:var(--text2)}.crumbs .s{margin:0 6px;opacity:.6}
.foot{display:flex;justify-content:space-between;align-items:center;height:64px;padding:0 36px;color:var(--text3);font-size:13px}
h1{font:800 28px/36px var(--font);letter-spacing:-.025em;margin:0 0 24px;color:var(--text)}
h2{font:700 16px/22px var(--font);letter-spacing:-.01em;margin:0 0 16px}
/* cards & grid */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);padding:22px 24px;margin-bottom:20px;box-shadow:inset 0 1px 0 rgba(255,255,255,.03)}
.grid{display:grid;gap:20px;margin-bottom:20px}
.grid>.card,.grid>div>.card:last-child{margin-bottom:0}
.g4{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.g2{grid-template-columns:1fr 1fr}
.stat{display:flex;flex-direction:column;position:relative;overflow:hidden}
.stat .head{display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:24px;margin-bottom:10px}
.stat .lbl{font:600 12px/1 var(--font);color:var(--text2)}
.stat .val{font:800 28px/36px var(--font);letter-spacing:-.03em;color:var(--text);white-space:nowrap}
.stat .sub{font-size:12px;line-height:16px;color:var(--text3);margin-top:4px}
.trend{display:inline-flex;align-items:center;gap:3px;height:24px;padding:0 9px;border-radius:99px;font:700 11.5px/1 var(--font);white-space:nowrap}
.trend svg.i{width:13px;height:13px;stroke-width:2.4}
.trend.up{color:var(--ok);background:var(--ok-bg)}.trend.down{color:var(--bad);background:var(--bad-bg)}.trend.flat{color:var(--text2);background:var(--surface2)}
.spark{display:flex;justify-content:space-between;align-items:stretch;height:86px;margin-top:auto;padding-top:20px;gap:6px}
.spark span{position:relative;flex:1;max-width:22px;background:var(--surface2);border-radius:8px}
.spark span i{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(to top,rgba(var(--acc-rgb),.55),rgba(var(--acc-rgb),.85));border-radius:8px;min-height:6px}
.spark span.now i{background:linear-gradient(to top,var(--acc),var(--acc2));box-shadow:0 0 18px rgba(var(--acc-rgb),.55)}
.prog{height:8px;background:var(--surface2);border-radius:99px;overflow:hidden;margin-top:auto}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2));border-radius:99px}
.prog.bad i{background:linear-gradient(90deg,var(--bad),var(--warn))}
.kv{display:flex;justify-content:space-between;font-size:12px;color:var(--text2);margin:20px 0 8px}
/* buttons */
button,.btn{font:600 13.5px/20px var(--font);height:40px;padding:0 15px;border-radius:var(--r-sm);border:1px solid var(--border);background:var(--surface2);color:var(--text);display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;white-space:nowrap;text-decoration:none;transition:background .15s,border-color .15s,transform .1s,filter .15s}
button:hover,.btn:hover{background:var(--surface3);border-color:var(--border2)}
button:active,.btn:active{transform:translateY(1px)}
button:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,.btn:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.pri{background:var(--grad);color:#fff;border-color:transparent;box-shadow:0 6px 20px rgba(var(--acc-rgb),.35)}
.pri:hover{background:var(--grad);filter:brightness(1.1);border-color:transparent}
.dark,.sec2{background:var(--acc-soft);color:var(--acc-text);border-color:rgba(var(--acc-rgb),.28)}
.dark:hover,.sec2:hover{background:rgba(var(--acc-rgb),.24);border-color:rgba(var(--acc-rgb),.45)}
.subtle{background:transparent}
.danger{color:var(--bad)}.danger:hover{background:var(--bad-bg);border-color:transparent}
.sm{height:32px;padding:0 11px;font-size:12px;line-height:14px;gap:6px;border-radius:9px}
.icon{width:40px;padding:0}
/* forms */
input,select,textarea{font:400 14px/20px var(--font);border:1px solid var(--border);border-radius:var(--r-sm);padding:9px 12px;width:100%;background:var(--surface2);color:var(--text);outline:0;transition:border-color .15s,box-shadow .15s,background .15s}
input,select{height:40px}
input[type=color]{padding:4px}
input::placeholder,textarea::placeholder{color:var(--text3)}
input:hover,select:hover,textarea:hover{border-color:var(--border2)}
input:focus,select:focus,textarea:focus{border-color:var(--acc);box-shadow:0 0 0 4px var(--ring);background:var(--surface)}
input:disabled{opacity:.6}
textarea{resize:vertical}
label{display:block;font:600 12px/16px var(--font);color:var(--text2);margin-bottom:7px}
.row{display:flex;gap:14px;align-items:end;flex-wrap:wrap}
.row>*{flex:1;min-width:120px}
.row>.nf{flex:0 0 auto;min-width:0}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:24px}
.toolbar h1{margin:0}
.toolbar .sp{flex:1}
/* tables */
table.t{width:100%;border-collapse:separate;border-spacing:0}
table.t th{font:700 10.5px/14px var(--font);letter-spacing:.09em;color:var(--text3);text-transform:uppercase;text-align:left;padding:10px 10px;white-space:nowrap}
table.t td{padding:14px 10px;border-top:1px solid var(--border);vertical-align:middle}
table.t tr:first-child td{border-top:0}
table.t tr:has(th)+tr td{border-top:1px solid var(--border)}
table.t th:first-child,table.t td:first-child{padding-left:12px}
table.t th:last-child,table.t td:last-child{padding-right:12px}
table.t tr.click{cursor:pointer}
table.t tr.click td{transition:background .12s}
table.t tr.click:hover td{background:var(--surface2)}
table.t tr.click:hover td:first-child{border-radius:12px 0 0 12px}
table.t tr.click:hover td:last-child{border-radius:0 12px 12px 0}
.r{text-align:right}
table.t th.r{text-align:right}
.mut{color:var(--text2)}
.tag{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:99px;font:600 11.5px/1 var(--font);background:var(--surface2);color:var(--text2);white-space:nowrap;vertical-align:middle}
.tag.Paid,.tag.Approved,.tag.Selesai,.tag.Partial,.tag.Sent,.tag.Overdue,.tag.Rejected,.tag.Expired,.tag.Batal,.tag.Unpaid,.tag.Draft,.tag.Belumselesai{padding-left:8px}
.tag.Paid::before,.tag.Approved::before,.tag.Selesai::before,.tag.Partial::before,.tag.Sent::before,.tag.Overdue::before,.tag.Rejected::before,.tag.Expired::before,.tag.Batal::before,.tag.Unpaid::before,.tag.Draft::before,.tag.Belumselesai::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.tag.Paid,.tag.Approved,.tag.Selesai{background:var(--ok-bg);color:var(--ok)}
.tag.Partial,.tag.Sent{background:var(--acc-soft);color:var(--acc-text)}
.tag.Overdue,.tag.Rejected,.tag.Expired,.tag.Batal{background:var(--bad-bg);color:var(--bad)}
.tag.Unpaid,.tag.Draft,.tag.Belumselesai{background:var(--warn-bg);color:var(--warn)}
.tag.QUO,.tag.INV{border-radius:7px;font-weight:800;letter-spacing:.04em;font-size:10.5px;height:22px;padding:0 7px}
.tag.QUO{background:var(--acc-soft);color:var(--acc-text)}
.tag.INV{background:transparent;color:var(--text);box-shadow:inset 0 0 0 1px var(--border2)}
.tag.legacy{background:transparent;color:var(--text3);box-shadow:inset 0 0 0 1px var(--border)}
.dn{font-weight:600}
.tabs{display:inline-flex;gap:4px;background:var(--surface2);padding:4px;border-radius:13px;margin-bottom:18px;border:1px solid var(--border)}
.tabs button{height:32px;padding:0 16px;background:transparent;border:0;border-radius:9px;color:var(--text2)}
.tabs button:hover{background:transparent;color:var(--text)}
.tabs button.on{background:var(--surface);color:var(--text);box-shadow:0 2px 8px rgba(0,0,0,.18),inset 0 0 0 1px var(--border)}
/* editor */
.editor{display:grid;grid-template-columns:minmax(480px,1fr) auto;gap:20px;align-items:start}
.pv-wrap{position:sticky;top:94px;overflow:hidden;border-radius:12px;box-shadow:var(--shadow);background:#fff}
.pv-wrap .paper{transform-origin:top left}
.item{border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:12px;background:var(--surface2);transition:border-color .15s,box-shadow .15s}
.item input,.item textarea,.item select{background:var(--surface)}
.item:focus-within{border-color:rgba(var(--acc-rgb),.5);box-shadow:0 0 0 4px var(--ring)}
.item .ih{display:flex;gap:6px;align-items:center;margin-bottom:10px}
.item .ih b{font:800 11px/1 var(--font);color:var(--acc-text);background:var(--acc-soft);padding:5px 8px;border-radius:7px}
.item .ih .sp{flex:1}
.item .lt{font-weight:700;margin-right:6px}
.item .ih button{width:32px;padding:0;background:var(--surface)}
.tot{display:grid;grid-template-columns:1fr auto;gap:6px 16px;max-width:340px;margin-left:auto}
.tot .big{font:800 20px/28px var(--font);letter-spacing:-.02em}
/* chart */
.bars{display:flex;align-items:stretch;gap:10px;height:210px;padding-top:12px}
.bars .b{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px}
.bars .pair{display:flex;gap:4px;align-items:flex-end;flex:1;width:100%;justify-content:center}
.bars .pair i{display:block;width:12px;border-radius:6px;background:rgba(var(--acc-rgb),.3);min-height:4px}
.bars .pair i.c{background:linear-gradient(to top,var(--acc),var(--acc2))}
.bars small{font:600 11px/1 var(--font);color:var(--text3)}
.legend{font-size:12px;color:var(--text2);display:flex;gap:16px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.alert{background:var(--warn-bg);border:1px solid color-mix(in srgb,var(--warn) 30%,transparent);color:var(--warn);padding:12px 16px;border-radius:14px;margin-bottom:20px;display:flex;gap:12px;align-items:center}
.alert .sp{flex:1}
.empty{color:var(--text3);text-align:center;padding:40px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(10px);background:var(--surface3);color:var(--text);border:1px solid var(--border2);padding:11px 18px;border-radius:12px;opacity:0;transition:.2s;pointer-events:none;z-index:99;font-weight:600;box-shadow:var(--shadow)}
.toast.on{opacity:1;transform:translateX(-50%)}
.view-paper{display:flex;justify-content:center}
.view-paper .paper{box-shadow:var(--shadow);border-radius:10px;overflow:hidden}
.imgbox{width:112px;height:112px;border:1px dashed var(--border2);border-radius:14px;display:flex;align-items:center;justify-content:center;background:#16181f;overflow:hidden}
.imgbox img{max-width:100%;max-height:100%}
details summary{cursor:pointer;color:var(--text2);font-size:12px;margin-top:10px}
.scrim{display:none}
#modeBtn svg{transition:transform .3s}#modeBtn:hover svg{transform:rotate(20deg)}
.swatches{display:flex;gap:10px}
.swatches button{width:36px;height:36px;padding:0;border-radius:50%;border:2px solid transparent}
.swatches button.on{border-color:var(--text);box-shadow:0 0 0 3px var(--surface) inset}

/* ============ PAPER (A4 document) ============ */
.paper{width:210mm;min-height:297mm;background:#fff;color:#111;font:9.5pt/1.4 "Helvetica Neue",Helvetica,Arial,sans-serif;position:relative;display:flex;flex-direction:column}
.p-head{background:#111;color:#fff;display:flex;justify-content:space-between;align-items:center;padding:9mm 12mm 8mm}
.p-co{display:flex;gap:5mm;align-items:center}
.p-co img{width:22mm;height:22mm;object-fit:contain}
.p-co .n{font-size:15pt;font-weight:800;letter-spacing:1px}
.p-co .d{font-size:8pt;color:#cfcfcf;line-height:1.45;white-space:pre-line}
.p-title{text-align:right}
.p-title .tt{font-size:26pt;font-weight:800;letter-spacing:3px;color:var(--pacc)}
.p-title .st{font-size:8pt;color:#aaa;margin-top:2mm}
.p-acc{height:2mm;background:var(--pacc)}
.p-body{padding:7mm 12mm 0;flex:1;display:flex;flex-direction:column}
.p-info{display:flex;justify-content:space-between;gap:10mm;margin-bottom:6mm}
.p-to .k,.p-meta .k{font-size:7.5pt;color:#888;text-transform:uppercase;letter-spacing:.8px}
.p-to .nm{font-weight:700;font-size:11pt;margin:1mm 0}
.p-to .ad{white-space:pre-line;color:#333}
.p-meta table{border-collapse:collapse}
.p-meta td{padding:.6mm 0 .6mm 6mm;text-align:right}
.p-meta td.k{text-align:left;padding-left:0}
.p-meta td.v{font-weight:600}
.p-proj{background:#f3f4f6;padding:2.5mm 4mm;border-left:1.2mm solid var(--pacc);margin-bottom:5mm;font-weight:600}
table.p-items{width:100%;border-collapse:collapse}
table.p-items thead th{background:#111;color:#fff;font-size:8pt;font-weight:600;padding:2.5mm 3mm;text-align:left;letter-spacing:.4px}
table.p-items thead th.r,table.p-items td.r{text-align:right}
table.p-items thead th.c,table.p-items td.c{text-align:center}
table.p-items td{padding:3mm;border-bottom:.3mm solid #e5e5e5;vertical-align:top}
table.p-items tr{break-inside:avoid;page-break-inside:avoid}
table.p-items .it{font-weight:700}
table.p-items .sp{color:#555;font-size:8.5pt;white-space:pre-line;margin-top:1mm}
.p-sum{display:flex;justify-content:space-between;gap:8mm;margin-top:5mm;break-inside:avoid;page-break-inside:avoid}
.p-words{flex:1;font-size:8.5pt;padding-top:1mm}
.p-words b{display:block;font-size:7.5pt;color:#888;letter-spacing:.8px;margin-bottom:1mm;font-weight:600}
.p-tot{width:75mm;border-collapse:collapse}
.p-tot td{padding:1.3mm 2mm}
.p-tot td.r{text-align:right}
.p-tot tr.gt td{background:var(--pacc);color:#fff;font-weight:800;font-size:11pt;padding:2.5mm 2mm}
.p-tot tr.bal td{font-weight:800;border-top:.3mm solid #111}
.p-foot{display:flex;gap:8mm;margin-top:auto;padding-top:7mm;break-inside:avoid;page-break-inside:avoid}
.p-terms{flex:1;font-size:8pt;color:#333}
.p-terms b,.p-pay b{display:block;font-size:7.5pt;color:#888;letter-spacing:.8px;margin-bottom:1.5mm}
.p-terms div{white-space:pre-line}
.p-pay{display:flex;gap:4mm;align-items:center;border:.3mm solid #ddd;border-radius:2mm;padding:3mm}
.p-pay img{width:28mm;height:28mm;object-fit:contain}
.p-pay .acc{font-size:12pt;font-weight:800;letter-spacing:1px}
.p-note{font-size:8.5pt;margin-top:4mm;white-space:pre-line;color:#333}
.p-bottom{text-align:center;font-size:7pt;color:#999;padding:5mm 12mm 0}
.stamp{position:absolute;top:95mm;right:20mm;border:1.2mm solid #059669;color:#059669;font-size:26pt;font-weight:900;padding:1mm 6mm;transform:rotate(-14deg);opacity:.75;letter-spacing:4px;border-radius:3mm}
.stamp.cx{border-color:#dc2626;color:#dc2626}

#print-root{display:none}
@media print{
  @page{size:A4;margin:12mm 0 12mm}
  @page :first{margin-top:0}
  body{background:#fff}
  .app,.toast{display:none!important}
  #print-root{display:block}
  #print-root .paper{min-height:285mm;box-shadow:none}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
@media (max-width:1280px){.editor{grid-template-columns:1fr}.pv-wrap{position:static}}
@media (max-width:900px){
  nav.side{position:fixed;left:-280px;transition:left .2s;box-shadow:var(--shadow)}
  body.menu nav.side{left:0}
  body.menu .scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(2px);z-index:35}
  nav.side{background:var(--surface)}
  #menuBtn{display:inline-flex}
  .topnav{padding:16px}.search{width:auto;flex:1}.topnav .newq,.topnav .avatar{display:none}
  main{padding:18px 16px}.foot{padding:0 16px}h1{font-size:24px;line-height:32px}.g2{grid-template-columns:1fr}
  .editor{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="app">
  <nav class="side" id="side">
    <a class="brand" href="#dash"><span class="lg"><img id="nav-logo" alt=""></span><div><b id="nav-name">DABELZ STUDIO</b><small>Invoice & Quotation</small></div></a>
    <div class="sec"><h3>Utama</h3>
      <a class="ni" href="#dash" data-nav="dash"><i data-i="grid"></i><span>Dashboard</span></a>
      <a class="ni" href="#docs" data-nav="docs"><i data-i="file"></i><span>Dokumen</span><b class="cnt" id="cnt-od" title="Invoice overdue"></b></a>
      <a class="ni" href="#reports" data-nav="reports"><i data-i="chart"></i><span>Laporan</span></a></div>
    <div class="sec"><h3>Data</h3>
      <a class="ni" href="#clients" data-nav="clients"><i data-i="users"></i><span>Client</span></a>
      <a class="ni" href="#items" data-nav="items"><i data-i="box"></i><span>Item / Servis</span></a></div>
    <div class="sec"><h3>Sistem</h3>
      <a class="ni" href="#settings" data-nav="settings"><i data-i="sliders"></i><span>Tetapan & Backup</span></a></div>
    <div id="fsb" class="fsb" onclick="fsBadgeClick()"></div>
  </nav>
  <div class="scrim" onclick="document.body.classList.remove('menu')"></div>
  <div class="wrap">
    <header class="topnav">
      <button id="menuBtn" class="icon" aria-label="Menu" onclick="document.body.classList.toggle('menu')"><i data-i="menu"></i></button>
      <div class="search"><i data-i="search"></i><input id="gsearch" type="search" placeholder="Cari no. dokumen, client, projek..." autocomplete="off"></div>
      <span class="sp"></span>
      <button class="sec2 newq" onclick="newDoc('QUO')"><i data-i="plus"></i>Quotation</button>
      <button class="pri" onclick="newDoc('INV')"><i data-i="plus"></i>Invoice</button>
      <button id="modeBtn" class="icon" title="Tukar mod gelap / cerah" aria-label="Tukar mod" onclick="toggleMode()"></button>
      <a class="avatar" id="avatar" href="#settings" title="Tetapan">DS</a>
    </header>
    <main><div class="crumbs" id="crumbs"></div><div id="main"></div></main>
    <footer class="foot"><span id="foot-l">© 2026 Dabelz Studio</span><span>Invoice & Quotation · v2</span></footer>
  </div>
</div>
<div id="print-root"></div>
<div class="toast" id="toast"></div>

<script>

/* amount in words (Malaysian style) */
function words(n){
  const o=['','ONE','TWO','THREE','FOUR','FIVE','SIX','SEVEN','EIGHT','NINE','TEN','ELEVEN','TWELVE','THIRTEEN','FOURTEEN','FIFTEEN','SIXTEEN','SEVENTEEN','EIGHTEEN','NINETEEN'];
  const t=['','','TWENTY','THIRTY','FORTY','FIFTY','SIXTY','SEVENTY','EIGHTY','NINETY'];
  const h=x=>{let s='';if(x>=100){s+=o[Math.floor(x/100)]+' HUNDRED';x%=100;if(x)s+=' AND '}
    if(x>=20){s+=t[Math.floor(x/10)];if(x%10)s+=' '+o[x%10]}else if(x)s+=o[x];return s};
  if(n===0)return 'ZERO';const parts=[];
  [[1e9,'BILLION'],[1e6,'MILLION'],[1e3,'THOUSAND']].forEach(([v,l])=>{if(n>=v){parts.push(h(Math.floor(n/v))+' '+l);n%=v}});
  if(n){parts.push((parts.length&&n<100?'AND ':'')+h(n))}
  return parts.join(' ');
}
function amountWords(v){v=r2(Math.abs(v));const rm=Math.floor(v),sen=Math.round((v-rm)*100);
  return 'RINGGIT MALAYSIA '+words(rm)+(sen?' AND SEN '+words(sen):'')+' ONLY';}

/* calc & status */
function qtyOf(it){if(it.sizes&&it.sizes.trim()){const s=parseSizes(it.sizes);return s.reduce((a,b)=>a+b[1],0)}return +it.qty||0}
function parseSizes(str){return (str||'').split(/[,;\n]+/).map(x=>x.trim()).filter(Boolean).map(x=>{const m=x.match(/^(.+?)\s*[:=x\-\s]\s*(\d+)$/i);return m?[m[1].trim().toUpperCase(),+m[2]]:null}).filter(Boolean)}
function calc(d){
  const sub=r2(d.items.reduce((a,it)=>a+(+it.price||0)*qtyOf(it),0));
  const disc=r2(d.discType==='%'?sub*(+d.discVal||0)/100:(+d.discVal||0));
  const net=r2(sub-disc);const tax=r2(net*(+d.taxPct||0)/100);const total=r2(net+tax);
  const cost=r2(d.items.reduce((a,it)=>a+(+it.cost||0)*qtyOf(it),0));
  const paid=r2((d.payments||[]).reduce((a,p)=>a+(+p.amount||0),0));
  return {sub,disc,net,tax,total,cost,profit:r2(net-cost),paid,balance:r2(total-paid),deposit:r2(total*(+d.depositPct||0)/100)};
}
function status(d){
  if(d.legacy)return d.legacyStatus;
  if(d.type==='INV'){if(d.cancelled)return 'Batal';const c=calc(d);
    if(c.total>0&&c.paid>=c.total)return 'Paid';if(c.paid>0)return d.due&&d.due<today()?'Overdue':'Partial';
    if(d.due&&d.due<today())return 'Overdue';return 'Unpaid'}
  const s=d.status||'Draft';if((s==='Sent'||s==='Draft')&&d.due&&d.due<today())return 'Expired';return s;
}
const live=d=>!d.legacy&&!(d.type==='INV'&&d.cancelled);
function nextNo(type,date){

  let mx=0;DB.docs.forEach(d=>{if(d.no&&d.no.startsWith(base)){const n=parseInt(d.no.slice(base.length));if(n>mx)mx=n}});
  return base+String(mx+1).padStart(2,'0');
}

function rmItem(i){if((ED.items[i].title||ED.items[i].price)&&!confirm('Buang item ini?'))return;ED.items.splice(i,1);drawItems();changed()}
function mvItem(i,dlt){const j=i+dlt;if(j<0||j>=ED.items.length)return;const a=ED.items;[a[i],a[j]]=[a[j],a[i]];drawItems();changed()}
function saveToLib(i){const it=ED.items[i];if(!it.title)return toast('Isi tajuk dulu');const ex=DB.items.find(x=>x.title===it.title);
  if(ex){if(!confirm('Item dengan tajuk sama wujud dalam library. Kemas kini?'))return;Object.assign(ex,{specs:it.specs,unit:it.unit,price:it.price,cost:it.cost})}
  else DB.items.push({id:uid(),title:it.title,specs:it.specs,unit:it.unit,price:it.price,cost:it.cost});save();toast('Disimpan ke library ⭐')}
function syncClient(d){const n=(d.client.name||'').trim();if(!n)return;let c=DB.clients.find(x=>x.id===d.clientId)||DB.clients.find(x=>x.name.trim().toLowerCase()===n.toLowerCase());
  if(!c){c={id:uid(),name:n,address:d.client.address,phone:d.client.phone,email:d.client.email,notes:''};DB.clients.push(c);toast('Client baru disimpan')}
  else{['address','phone','email'].forEach(k=>{if(!c[k]&&d.client[k])c[k]=d.client[k]})}
  d.clientId=c.id}
function finishEdit(){const d=ED;if(DB.docs.some(x=>x!==d&&x.no===d.no)&&!confirm('No. dokumen bertindih dengan dokumen lain. Teruskan?'))return;
  syncClient(d);delete d.fresh;save();go(d.legacy?'docs':'view/'+d.id)}


/* ================== VIEW ================== */
function vView(m,id){

  const isQ=d.type==='QUO',c=calc(d),st=status(d);const from=d.fromId&&getDoc(d.fromId);const to=DB.docs.filter(x=>x.fromId===d.id);
  m.innerHTML=`<div class="toolbar"><a class="btn icon" href="#docs" aria-label="Kembali">${ic('back')}</a><h1>${esc(d.no)}</h1><span class="tag ${st.replace(/\s/g,'')}">${st}</span><span class="sp"></span>
    <button onclick="go('edit/${d.id}')">${ic('edit')}Edit</button>
    <button onclick="waShare('${d.id}')">${ic('chat')}WhatsApp</button>
    <button onclick="duplicate('${d.id}')">${ic('copy')}Salin</button>
    ${isQ?`<button onclick="duplicate('${d.id}',true)">${ic('layers')}Revisi</button><button class="sec2" onclick="convert('${d.id}')">${ic('arrow')}Tukar ke Invoice</button>`:''}
    ${!isQ?`<button onclick="toggleCancel('${d.id}')">${ic('ban')}${d.cancelled?'Aktifkan':'Batal'}</button>`:''}
    <button class="danger icon" title="Padam" onclick="delDoc('${d.id}')">${ic('trash')}</button>
    <button class="pri" onclick="printDoc(getDoc('${d.id}'))">${ic('print')}Print / PDF</button></div>
  <div class="grid" style="grid-template-columns:minmax(0,1fr) 340px;align-items:start">
    <div class="view-paper" id="vp"></div>
    <div>
      <div class="card"><h2>Ringkasan</h2><div class="tot" style="max-width:none">
        <span class="mut">Client</span><span class="r">${esc(d.client.name)}</span>
        <span class="mut">Jumlah</span><span class="r"><b>${RM(c.total)}</b></span>
        ${!isQ?`<span class="mut">Dibayar</span><span class="r">${RM(c.paid)}</span><span class="mut">Baki</span><span class="r" style="color:${c.balance>0?'var(--amb)':'var(--grn)'};font-weight:700">${RM(c.balance)}</span>`:`<span class="mut">Deposit ${+d.depositPct}%</span><span class="r">${RM(c.deposit)}</span>`}
        ${c.cost?`<span class="mut">Untung anggaran</span><span class="r" style="color:var(--grn)">${RM(c.profit)}</span>`:''}</div>
        ${from?`<div style="margin-top:10px" class="mut">Dari quotation: <a href="#view/${from.id}">${esc(from.no)}</a></div>`:''}
        ${to.length?`<div style="margin-top:10px" class="mut">Invoice: ${to.map(x=>`<a href="#view/${x.id}">${esc(x.no)}</a>`).join(', ')}</div>`:''}
        <div style="margin-top:12px"><label>${isQ?'Status quotation':'Status job'}</label>
        ${isQ?`<select onchange="getDoc('${d.id}').status=this.value;save();route()">${QSTAT.map(s=>`<option ${d.status===s?'selected':''}>${s}</option>`).join('')}</select>`:
        `<select onchange="getDoc('${d.id}').job=this.value;save();toast('Status job dikemas kini')">${JOB.map(s=>`<option ${d.job===s?'selected':''}>${s}</option>`).join('')}</select>`}</div></div>
      ${!isQ?`<div class="card"><h2>Bayaran</h2>
        ${(d.payments||[]).length?`<table class="t">${d.payments.map((p,i)=>`<tr><td>${shortDate(p.date)}<div class="mut" style="font-size:12px">${esc(p.no||'')} · ${esc(p.method)}${p.note?' · '+esc(p.note):''}</div></td><td class="r"><b>${fmt(p.amount)}</b><div><button class="sm" onclick="printDoc(getDoc('${d.id}'),{receipt:${i}})">${ic('print')}Resit</button> <button class="sm danger" title="Padam" onclick="rmPay('${d.id}',${i})">${ic('x')}</button></div></td></tr>`).join('')}</table>`:'<div class="mut">Belum ada bayaran.</div>'}
        ${c.balance>0.004&&!d.cancelled?`<div style="margin-top:12px;border-top:1px solid var(--line);padding-top:12px"><div class="row"><div><label>Tarikh</label><input type="date" id="pd" value="${today()}"></div><div><label>Amaun (RM)</label><input type="number" step="0.01" id="pa" value="${(d.payments||[]).length?c.balance:(+d.depositPct&&+d.depositPct<100?c.deposit:c.total)}"></div></div>
          <div class="row" style="margin-top:8px"><div><label>Kaedah</label><select id="pm"><option>DuitNow QR</option><option>Bank Transfer</option><option>Cash</option><option>Cheque</option></select></div><div><label>Nota</label><input id="pn" placeholder="cth: Deposit 50%"></div></div>
          <div class="row" style="margin-top:8px"><button class="pri" onclick="addPay('${d.id}')">${ic('plus')}Rekod bayaran</button><button class="nf" onclick="$('#pa').value=${c.balance}">Penuh</button></div></div>`:''}</div>`:''}
    </div></div>`;
  $('#vp').innerHTML=paperHTML(d);
  const p=$('#vp .paper'),w=$('#vp').clientWidth;if(w<p.offsetWidth){const sc=w/p.offsetWidth;p.style.transform=`scale(${sc})`;p.style.transformOrigin='top left';$('#vp').style.height=p.offsetHeight*sc+'px';$('#vp').style.justifyContent='flex-start'}
}
function addPay(id){const d=getDoc(id);const a=+$('#pa').value;if(!(a>0))return toast('Masukkan amaun');const dt=$('#pd').value||today();
  const base=`RCP-${S().prefix}.${dt.replace(/-/g,'')}-`;let n=0;DB.docs.forEach(x=>(x.payments||[]).forEach(p=>{if(p.no&&p.no.startsWith(base))n=Math.max(n,parseInt(p.no.slice(base.length)))}));
  d.payments.push({date:dt,amount:r2(a),method:$('#pm').value,note:$('#pn').value,no:base+String(n+1).padStart(2,'0')});
  if(status(d)==='Paid'&&d.job==='Ready')d.job='Delivered';save();toast('Bayaran direkod');route()}
function rmPay(id,i){if(!confirm('Padam rekod bayaran ini?'))return;getDoc(id).payments.splice(i,1);save();route()}
function toggleCancel(id){const d=getDoc(id);if(!d.cancelled&&!confirm('Batalkan invoice ini? (Rekod kekal, tapi tidak dikira dalam jualan.)'))return;d.cancelled=!d.cancelled;save();route()}
function waShare(id){const d=getDoc(id),c=calc(d),s=S(),isQ=d.type==='QUO';
  let ph=(d.client.phone||'').replace(/\D/g,'');if(ph.startsWith('0'))ph='6'+ph;
  const msg=`Salam ${d.client.name||''},\n\nBerikut ${isQ?'quotation':'invoice'} ${d.no}${d.project?' untuk '+d.project:''}.\nJumlah: ${RM(c.total)}`+
    (isQ?(+d.depositPct?`\nDeposit ${+d.depositPct}% untuk sahkan order: ${RM(c.deposit)}`:''):(c.paid?`\nTelah dibayar: ${RM(c.paid)}\nBaki: ${RM(c.balance)}`:''))+
    (isQ?`\nSah sehingga: ${shortDate(d.due)}`:`\n\nBayaran boleh dibuat ke:\n${s.bankName}\n${s.bankHolder}\n${s.bankAcc}`)+`\n\nTerima kasih!\n${s.name}`;
  window.open(`https://wa.me/${ph}?text=${encodeURIComponent(msg)}`,'_blank');toast('Jangan lupa attach PDF dalam WhatsApp')}

/* ================== CLIENTS ================== */
function vClients(m){
  const rows=DB.clients.slice().sort((a,b)=>a.name.localeCompare(b.name)).map(c=>{const ds=DB.docs.filter(d=>d.clientId===c.id&&live(d));
    const tot=ds.filter(d=>d.type==='INV').reduce((a,d)=>a+calc(d).total,0),bal=ds.filter(d=>d.type==='INV').reduce((a,d)=>a+Math.max(0,calc(d).balance),0);
    return `<tr><td><b>${esc(c.name)}</b><div class="mut" style="white-space:pre-line;font-size:12px">${esc(c.address)}</div></td><td>${esc(c.phone)}<div class="mut">${esc(c.email)}</div></td>
    <td class="r">${ds.length}</td><td class="r">${fmt(tot)}</td><td class="r" style="color:${bal>0?'var(--amb)':''}">${fmt(bal)}</td>
    <td class="r"><button class="sm" onclick="go('docs/${c.id}')">Dokumen</button> <button class="sm" onclick="editClient('${c.id}')">Edit</button> <button class="sm" onclick="newFor('${c.id}','QUO')">+QUO</button> <button class="sm" onclick="newFor('${c.id}','INV')">+INV</button></td></tr>`}).join('');
  m.innerHTML=`<div class="toolbar"><h1>Client</h1><span class="sp"></span><button class="pri" onclick="editClient()">${ic('plus')}Client baru</button></div>
  <div id="cform"></div><div class="card">${DB.clients.length?`<table class="t"><tr><th>Nama & alamat</th><th>Hubungan</th><th class="r">Dok.</th><th class="r">Jumlah invoice</th><th class="r">Tertunggak</th><th></th></tr>${rows}</table>`:'<div class="empty">Tiada client lagi.</div>'}</div>`;
}
function newFor(cid,type){const c=DB.clients.find(x=>x.id===cid);const d=blankDoc(type);d.clientId=c.id;d.client={name:c.name,address:c.address,phone:c.phone,email:c.email};DB.docs.push(d);save();go('edit/'+d.id)}
function editClient(id){const c=id?DB.clients.find(x=>x.id===id):{id:'',name:'',address:'',phone:'',email:'',notes:''};
  $('#cform').innerHTML=`<div class="card"><h2>${id?'Edit':'Tambah'} client</h2><div class="row"><div><label>Nama / Syarikat</label><input id="cn" value="${esc(c.name)}"></div><div><label>Telefon</label><input id="cp" value="${esc(c.phone)}"></div><div><label>Emel</label><input id="ce" value="${esc(c.email)}"></div></div>
  <div class="row" style="margin-top:10px"><div><label>Alamat</label><textarea id="ca" rows="3">${esc(c.address)}</textarea></div><div><label>Nota dalaman</label><textarea id="cno" rows="3">${esc(c.notes||'')}</textarea></div></div>
  <div class="row" style="margin-top:10px"><button class="pri nf" onclick="saveClient('${id||''}')">Simpan</button><button class="nf" onclick="$('#cform').innerHTML=''">Batal</button>${id?`<span></span><button class="nf danger" onclick="delClient('${id}')">Padam client</button>`:''}</div></div>`;$('#cn').focus()}
function saveClient(id){const v={name:$('#cn').value.trim(),phone:$('#cp').value,email:$('#ce').value,address:$('#ca').value,notes:$('#cno').value};if(!v.name)return toast('Isi nama');
  if(id)Object.assign(DB.clients.find(x=>x.id===id),v);else DB.clients.push({id:uid(),...v});save();toast('Client disimpan');vClients($('#main'))}
function delClient(id){if(!confirm('Padam client ini? Dokumen sedia ada tidak terjejas.'))return;DB.clients=DB.clients.filter(x=>x.id!==id);save();vClients($('#main'))}

function itm(id,k,v){DB.items.find(x=>x.id===id)[k]=v;saveSoon()}

/* ================== REPORTS ================== */
let RY=String(new Date().getFullYear());
function vReports(m){
  const inv=DB.docs.filter(d=>live(d)&&d.type==='INV');const years=[...new Set([RY,...DB.docs.map(d=>(d.date||'').slice(0,4)).filter(Boolean)])].sort().reverse();
  const mrows=[...Array(12)].map((_,i)=>{const k=RY+'-'+String(i+1).padStart(2,'0');const ds=inv.filter(d=>d.date.startsWith(k));
    const col=inv.reduce((a,d)=>a+(d.payments||[]).filter(p=>p.date.startsWith(k)).reduce((x,p)=>x+(+p.amount||0),0),0);
    const q=DB.docs.filter(d=>!d.legacy&&d.type==='QUO'&&d.date.startsWith(k));
    return {k,n:ds.length,tot:ds.reduce((a,d)=>a+calc(d).total,0),cost:ds.reduce((a,d)=>a+calc(d).cost,0),pr:ds.reduce((a,d)=>a+calc(d).profit,0),col,q:q.length,qa:q.filter(x=>x.status==='Approved').length}});
  const S2=k=>mrows.reduce((a,r)=>a+r[k],0);
  const byC={};inv.filter(d=>d.date.startsWith(RY)).forEach(d=>{const n=d.client.name||'(tiada nama)';byC[n]=byC[n]||{n:0,t:0,b:0};byC[n].n++;byC[n].t+=calc(d).total;byC[n].b+=Math.max(0,calc(d).balance)});
  const top=Object.entries(byC).sort((a,b)=>b[1].t-a[1].t);
  const qAll=S2('q'),qOk=S2('qa');
  m.innerHTML=`<div class="toolbar"><h1>Laporan</h1><select style="max-width:110px" onchange="RY=this.value;vReports($('#main'))">${years.map(y=>`<option ${y===RY?'selected':''}>${y}</option>`).join('')}</select><span class="sp"></span><button class="subtle" onclick="exportCSV()">${ic('down')}CSV semua dokumen</button></div>
  <div class="grid g4"><div class="card stat"><div class="lbl">Jualan ${RY}</div><div class="val">${RM(S2('tot'))}</div></div>
    <div class="card stat"><div class="lbl">Kutipan ${RY}</div><div class="val">${RM(S2('col'))}</div></div>
    <div class="card stat"><div class="lbl">Untung anggaran</div><div class="val" style="color:var(--grn)">${RM(S2('pr'))}</div><div class="sub">berdasarkan kos item yang diisi</div></div>
    <div class="card stat"><div class="lbl">Kadar quotation diterima</div><div class="val">${qAll?Math.round(qOk/qAll*100):0}%</div><div class="sub">${qOk} / ${qAll} quotation</div></div></div>
  <div class="card"><h2>Bulanan ${RY}</h2><table class="t"><tr><th>Bulan</th><th class="r">Invoice</th><th class="r">Jualan</th><th class="r">Kos</th><th class="r">Untung</th><th class="r">Kutipan</th><th class="r">Quotation</th></tr>
    ${mrows.map(r=>`<tr><td>${MS[+r.k.slice(5)-1]}</td><td class="r">${r.n}</td><td class="r">${fmt(r.tot)}</td><td class="r mut">${fmt(r.cost)}</td><td class="r">${fmt(r.pr)}</td><td class="r">${fmt(r.col)}</td><td class="r">${r.q}</td></tr>`).join('')}
    <tr><td><b>Jumlah</b></td><td class="r"><b>${S2('n')}</b></td><td class="r"><b>${fmt(S2('tot'))}</b></td><td class="r"><b>${fmt(S2('cost'))}</b></td><td class="r"><b>${fmt(S2('pr'))}</b></td><td class="r"><b>${fmt(S2('col'))}</b></td><td class="r"><b>${qAll}</b></td></tr></table></div>
  <div class="card"><h2>Client teratas ${RY}</h2>${top.length?`<table class="t"><tr><th>Client</th><th class="r">Invoice</th><th class="r">Jumlah</th><th class="r">Tertunggak</th></tr>${top.map(([n,v])=>`<tr><td>${esc(n)}</td><td class="r">${v.n}</td><td class="r">${fmt(v.t)}</td><td class="r">${fmt(v.b)}</td></tr>`).join('')}</table>`:'<div class="mut">Tiada data.</div>'}</div>
  <p class="mut">Nota: rekod lama dari Excel (tanpa item) tidak dikira dalam jumlah.</p>`;
}

    <div class="row">${f('termsQUO','Terma default — Quotation','ta',6)}${f('termsINV','Terma default — Invoice','ta',6)}</div>
    <div style="margin-top:10px">${f('footer','Teks kaki dokumen')}</div></div>`;
  m.querySelectorAll('[data-s]').forEach(el=>el.addEventListener('input',()=>{const k=el.dataset.s;s[k]=['quoDays','invDays','depositPct','taxPct'].includes(k)?(+el.value||0):el.value;saveSoon();if(k==='name')$('#nav-name').textContent=s.name}));
}
function setImg(k,file){if(!file)return;const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{const mx=k==='qr'?600:300,sc=Math.min(1,mx/Math.max(img.width,img.height));
  const cv=document.createElement('canvas');cv.width=img.width*sc;cv.height=img.height*sc;cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);S()[k]=cv.toDataURL('image/png');save();route();toast('Imej dikemas kini')};img.src=r.result};r.readAsDataURL(file)}
function exportJSON(){S().lastBackup=Date.now();save();download(`dabelz-backup-${today()}.json`,JSON.stringify(DB,null,1),'application/json');toast('Backup dimuat turun');setTimeout(route,300)}
function importJSON(file){if(!file)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(!x.docs||!x.settings)throw new Error('Format tidak sah');
  if(!confirm(`Restore akan GANTIKAN semua data sekarang dengan backup ini (${x.docs.length} dokumen, ${x.clients.length} client). Teruskan?`))return;DB=x;save();toast('Data dipulihkan');go('dash');route()}catch(e){alert('Gagal baca backup: '+e.message)}};r.readAsText(file)}
function resetAll(){if(!confirm('PADAM SEMUA data dan kembali ke data contoh asal? Buat backup dahulu!'))return;if(prompt('Taip RESET untuk sahkan')!=='RESET')return;localStorage.removeItem(KEY);load();go('dash');route()}

/* ================== BOOT ================== */
/* ================== GOOGLE DRIVE AUTO-SAVE (File System Access API) ================== */
const FS={handle:null,state:'off',last:0,err:''}; // off | ok | saving | need | error | unsupported
const fsOK=()=>'showSaveFilePicker' in window;
function idb(){return new Promise((res,rej)=>{const r=indexedDB.open('dabelz_fs',1);r.onupgradeneeded=()=>r.result.createObjectStore('h');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function idbGet(k){const db=await idb();return new Promise(r=>{const q=db.transaction('h').objectStore('h').get(k);q.onsuccess=()=>r(q.result||null);q.onerror=()=>r(null)})}
async function idbSet(k,v){const db=await idb();return new Promise(r=>{const t=db.transaction('h','readwrite');const st=t.objectStore('h');v==null?st.delete(k):st.put(v,k);t.oncomplete=()=>r();t.onerror=()=>r()})}
async function fsInit(){
  if(!fsOK()){FS.state='unsupported';return fsBadge()}
  FS.handle=await idbGet('file').catch(()=>null);
  if(!FS.handle){FS.state='off';return fsBadge()}
  let p='prompt';try{p=await FS.handle.queryPermission({mode:'readwrite'})}catch(e){}
  if(p==='granted')await fsPull();else FS.state='need';
  fsBadge();if(!location.hash.startsWith('#edit'))route();
}
async function fsConnect(){if(!FS.handle)return go('settings');
  try{const p=await FS.handle.requestPermission({mode:'readwrite'});if(p!=='granted')return toast('Kebenaran tidak diberi')}catch(e){FS.state='error';FS.err=e.message;fsBadge();return}
  await fsPull();fsBadge();route();toast('☁️ Disambung ke Google Drive')}
async function fsRead(){const f=await FS.handle.getFile();const t=await f.text();if(!t.trim())return null;const x=JSON.parse(t);return x&&x.docs&&x.settings?x:null}
async function fsPull(){ // ambil versi terbaru: fail Drive vs browser
  try{const x=await fsRead();
    if(x&&(x.savedAt||0)>(DB.savedAt||0)){DB=x;localStorage.setItem(KEY,JSON.stringify(DB));toast('☁️ Data terkini dimuat dari Google Drive');FS.state='ok';FS.last=Date.now()}
    else if(!x||(DB.savedAt||0)>(x.savedAt||0))await fsWrite();
    else{FS.state='ok';FS.last=Date.now()}
  }catch(e){FS.state=e.name==='NotAllowedError'?'need':'error';FS.err=e.message}
}
let fsT;function fsSoon(){if(!FS.handle||!['ok','saving'].includes(FS.state))return;clearTimeout(fsT);fsT=setTimeout(fsWrite,800)}
async function fsWrite(){if(!FS.handle)return;clearTimeout(fsT);
  try{FS.state='saving';fsBadge();const w=await FS.handle.createWritable();await w.write(JSON.stringify(DB));await w.close();FS.state='ok';FS.last=Date.now();FS.err=''}
  catch(e){FS.state=e.name==='NotAllowedError'?'need':'error';FS.err=e.message}
  fsBadge();const st=$('#fs-status');if(st)st.innerHTML=fsStatusText()}
async function fsPickNew(){if(!fsOK())return alert('Browser ini tidak menyokong auto-save ke fail. Sila buka app ini dalam Google Chrome atau Microsoft Edge.');
  try{const h=await showSaveFilePicker({suggestedName:'dabelz-data.json',types:[{description:'Data Dabelz',accept:{'application/json':['.json']}}]});
    FS.handle=h;await idbSet('file',h);await fsWrite();route();toast('☁️ Auto-save ke '+h.name+' diaktifkan')}catch(e){if(e.name!=='AbortError')alert('Gagal: '+e.message)}}
async function fsPickOpen(){if(!fsOK())return alert('Sila guna Google Chrome atau Microsoft Edge.');
  try{const [h]=await showOpenFilePicker({types:[{description:'Data Dabelz',accept:{'application/json':['.json']}}]});
    const x=JSON.parse(await (await h.getFile()).text());if(!x.docs||!x.settings)throw new Error('Ini bukan fail data Dabelz.');
    if(!confirm(`Guna data dari fail "${h.name}" (${x.docs.length} dokumen, ${x.clients.length} client)?\nData dalam browser ini akan DIGANTI dengan data dari fail.`))return;
    DB=x;localStorage.setItem(KEY,JSON.stringify(DB));FS.handle=h;await idbSet('file',h);
    let p='prompt';try{p=await h.requestPermission({mode:'readwrite'})}catch(e){}
    FS.state=p==='granted'?'ok':'need';FS.last=Date.now();fsBadge();go('settings');route();toast('Data dimuat dari '+h.name)}
  catch(e){if(e.name!=='AbortError')alert('Gagal: '+e.message)}}
async function fsUnlink(){if(!confirm('Hentikan auto-save ke fail ini? (Fail dalam Drive tidak dipadam.)'))return;FS.handle=null;await idbSet('file',null);FS.state='off';fsBadge();route()}
function fsStatusText(){const t=FS.last?new Date(FS.last).toLocaleTimeString('ms-MY',{hour:'2-digit',minute:'2-digit'}):'';
  return {off:'Belum disambung',unsupported:'Browser tidak menyokong — guna Chrome/Edge',ok:'Google Drive · disimpan '+t,saving:'Google Drive · menyimpan…',need:'Drive terputus — klik untuk sambung',error:'Gagal simpan ke Drive — klik'}[FS.state]}
function fsBadge(){const b=$('#fsb');if(!b)return;b.className='fsb '+FS.state;b.textContent=FS.state==='off'||FS.state==='unsupported'?'':fsStatusText();b.title=FS.err||(FS.handle?FS.handle.name:'')}
function fsBadgeClick(){if(FS.state==='need')fsConnect();else if(FS.state==='error')fsWrite().then(()=>{if(FS.state!=='ok')go('settings')});else go('settings')}
function driveCard(){
  const linked=!!FS.handle;
  return `<div class="card" style="box-shadow:inset 0 0 0 1px var(--p100)"><h2 style="display:flex;gap:8px;align-items:center">${ic('cloud')}Auto-save ke Google Drive</h2>
  ${!fsOK()?`<div class="alert">Browser ini tidak menyokong ciri ini. Buka fail app ini dalam <b>Google Chrome</b> (atau Edge).</div>`:''}
  ${linked?`<p>Disambung ke fail: <b>${esc(FS.handle.name)}</b> — <span id="fs-status">${fsStatusText()}</span></p>
    <p class="mut">Setiap perubahan ditulis terus ke fail ini dan Google Drive for Desktop akan sync ke cloud. Bila buka app di komputer lain yang disambung ke fail sama, data terkini dimuat automatik.</p>
    <div class="row">${FS.state==='need'||FS.state==='error'?`<button class="pri nf" onclick="fsConnect()">Sambung semula</button>`:`<button class="pri nf" onclick="fsWrite()">Simpan sekarang</button>`}
      <button class="nf" onclick="fsPull().then(()=>{fsBadge();route()})">Muat semula dari Drive</button><button class="nf" onclick="fsPickNew()">Tukar fail</button><span></span><button class="nf danger" onclick="fsUnlink()">Hentikan</button></div>`
  :`<p class="mut">Simpan semua data secara automatik ke satu fail dalam folder Google Drive anda. Ia juga jadi backup berterusan.</p>
    <ol class="mut" style="margin:0 0 12px;padding-left:18px;line-height:1.7">
      <li>Klik <b>Cipta fail sync baru</b>.</li>
      <li>Dalam tetingkap Save, pilih <b>Google Drive → My Drive</b> di sidebar kiri (boleh buat folder "Dabelz").</li>
      <li>Tekan <b>Save</b>. Siap — setiap perubahan akan disimpan ke fail itu.</li></ol>
    <p class="mut" style="font-size:12px">Komputer lain / data sedia ada di Drive? Guna <b>Buka fail sedia ada</b>.</p>
    <div class="row"><button class="pri nf" onclick="fsPickNew()">Cipta fail sync baru</button><button class="nf" onclick="fsPickOpen()">Buka fail sedia ada</button></div>`}
  </div>`}
document.addEventListener('visibilitychange',()=>{ // tarik perubahan dari komputer lain bila kembali ke tab
  if(document.visibilityState==='visible'&&FS.handle&&FS.state==='ok'&&!location.hash.startsWith('#edit'))fsRead().then(x=>{if(x&&(x.savedAt||0)>(DB.savedAt||0)){DB=x;localStorage.setItem(KEY,JSON.stringify(DB));route();toast('☁️ Data dikemas kini dari Drive')}}).catch(()=>{})});
window.addEventListener('pagehide',()=>{if(fsT)fsWrite()});

document.querySelectorAll('i[data-i]').forEach(e=>e.outerHTML=ic(e.dataset.i));
$('#gsearch').addEventListener('input',e=>{LF.q=e.target.value;if(!location.hash.startsWith('#docs'))go('docs');else vDocs($('#main'));});
$('#gsearch').addEventListener('keydown',e=>{if(e.key==='Escape'){e.target.value='';LF.q='';if(location.hash.startsWith('#docs'))vDocs($('#main'))}});
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
load();applyTheme();route();fsInit();
window.addEventListener('resize',()=>{if(location.hash.startsWith('#edit'))changed(true)});
</script>
</body>
</html>
